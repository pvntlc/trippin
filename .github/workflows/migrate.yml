name: Migration helper

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "transfer-db | stop-old | harden-old | inspect-old-sm | retire-old-sm"
        required: true
        default: "harden-old"

jobs:
  transfer:
    if: ${{ inputs.mode == 'transfer-db' }}
    runs-on: ubuntu-latest
    steps:
      - name: Write SSH keys
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.OCI_SSH_KEY }}"     | tr -d '\r' > ~/.ssh/old_key
          printf '%s\n' "${{ secrets.OCI_NEW_SSH_KEY }}" | tr -d '\r' > ~/.ssh/new_key
          chmod 600 ~/.ssh/old_key ~/.ssh/new_key
          ssh-keyscan -p 2222 ${{ secrets.OCI_HOST }}     >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan -p 2222 ${{ secrets.OCI_NEW_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      - name: Pull db from old server
        run: |
          scp -P 2222 -i ~/.ssh/old_key \
            ${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}:trippin/backend/trippin.db ./trippin.db
          ls -la trippin.db
      - name: Push db to new server
        run: |
          ssh -p 2222 -i ~/.ssh/new_key ${{ secrets.OCI_USER }}@${{ secrets.OCI_NEW_HOST }} 'mkdir -p ~/migration-incoming'
          scp -P 2222 -i ~/.ssh/new_key ./trippin.db \
            ${{ secrets.OCI_USER }}@${{ secrets.OCI_NEW_HOST }}:migration-incoming/trippin.db

  stop-old:
    if: ${{ inputs.mode == 'stop-old' }}
    runs-on: ubuntu-latest
    steps:
      - name: Stop trippin on old server (single source of truth on new)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: 2222
          script: |
            sudo systemctl stop trippin
            sudo systemctl disable trippin
            echo "old trippin stopped:"; systemctl is-active trippin || true

  harden-old:
    if: ${{ inputs.mode == 'harden-old' }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden old server (nginx admin block + fail2ban + auto-updates)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: 2222
          command_timeout: 15m
          script: |
            set -e
            # 1) 구서버 stock-manager 는 별도 admin 토큰 코드가 없음 → nginx 에서 admin API 차단
            SM=$(ls /etc/nginx/sites-enabled/ | grep -i stock | head -1)
            if [ -n "$SM" ] && ! sudo grep -q "location /api/v1/admin/" /etc/nginx/sites-enabled/$SM; then
              sudo sed -i '0,/location \/api\//s##location /api/v1/admin/ { return 403; }\n    location /api/#' /etc/nginx/sites-enabled/$SM
              sudo nginx -t && sudo systemctl reload nginx && echo "admin API blocked at nginx"
            else
              echo "admin block already present or stock-manager site not found ($SM)"
            fi
            # 2) fail2ban + unattended-upgrades
            export DEBIAN_FRONTEND=noninteractive
            sudo apt-get update -qq >/dev/null 2>&1
            sudo apt-get install -y -qq fail2ban unattended-upgrades >/dev/null 2>&1
            printf '[sshd]\nenabled = true\nport = 22,2222\nmaxretry = 4\nbantime = 3600\n' | sudo tee /etc/fail2ban/jail.d/sshd.local >/dev/null
            sudo systemctl enable fail2ban >/dev/null 2>&1; sudo systemctl restart fail2ban
            printf 'APT::Periodic::Update-Package-Lists "1";\nAPT::Periodic::Unattended-Upgrade "1";\n' | sudo tee /etc/apt/apt.conf.d/20auto-upgrades >/dev/null
            sudo systemctl enable unattended-upgrades >/dev/null 2>&1
            # 3) sshd: root 로그인 차단
            printf 'PermitRootLogin no\nX11Forwarding no\nMaxAuthTries 3\n' | sudo tee /etc/ssh/sshd_config.d/99-hardening.conf >/dev/null
            sudo sshd -t && sudo systemctl reload ssh && echo "sshd hardened"
            echo "=== verify admin blocked ==="
            curl -s -o /dev/null -w "admin/server-info via nginx: %{http_code}\n" http://127.0.0.1/api/v1/admin/server-info || true

  # 구서버의 옛 마켓아이(stock-manager) 내리기(2026-10-10 보안 점검) — 이 저장소는 공개라 실행 로그도 공개다.
  # 로그에는 서비스·폴더 '이름과 상태'만 찍고 파일 내용·주소·키는 찍지 않는다. 데이터는 지우지 않고 잠근다.
  inspect-old-sm:
    if: ${{ inputs.mode == 'inspect-old-sm' }}
    runs-on: ubuntu-latest
    steps:
      - name: Inspect old server (names and states only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: 2222
          script: |
            for s in stock-manager trippin nginx; do printf '%s: ' "$s"; systemctl is-active "$s" 2>/dev/null || true; done
            printf 'stock-manager enabled: '; systemctl is-enabled stock-manager 2>/dev/null || true
            echo "sites-enabled:"; ls /etc/nginx/sites-enabled/ 2>/dev/null | sed 's/^/  /'
            echo "web roots:"; ls -d /var/www/*/ 2>/dev/null | sed 's/^/  /'
            printf 'app dir present: '; [ -d "$HOME/stock-manager" ] && echo yes || echo no
            printf 'local / title: '; curl -s --max-time 5 http://127.0.0.1/ | grep -o '<title>[^<]*</title>' | head -1 || true
            printf 'local api health: '; curl -s -o /dev/null -w '%{http_code}\n' --max-time 5 http://127.0.0.1/api/v1/health || true

  retire-old-sm:
    if: ${{ inputs.mode == 'retire-old-sm' }}
    runs-on: ubuntu-latest
    steps:
      - name: Retire old stock-manager (stop, unpublish, lock; no deletion)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: 2222
          command_timeout: 10m
          script: |
            set -e
            STAMP=$(date +%Y%m%d)
            # 1) 옛 API 서비스 끄기
            if systemctl list-unit-files 2>/dev/null | grep -q '^stock-manager\.service'; then
              sudo systemctl disable --now stock-manager
            fi
            printf 'stock-manager: '; systemctl is-active stock-manager 2>/dev/null || true
            # 2) 웹 공개 끊기 — 화면 파일을 root 만 여는 곳으로 옮긴다(지우지 않는다)
            sudo mkdir -p /root/retired && sudo chmod 700 /root/retired
            if [ -d /var/www/stock-manager ]; then
              sudo mv /var/www/stock-manager "/root/retired/www-stock-manager-$STAMP"
              echo "web root moved to /root/retired"
            fi
            # 3) nginx 에서 옛 마켓아이 사이트 끄기(설정 파일은 sites-available 에 그대로 둔다)
            for f in $(ls /etc/nginx/sites-enabled/ 2>/dev/null | grep -i stock || true); do
              sudo rm -f "/etc/nginx/sites-enabled/$f"
              echo "disabled site: $f"
            done
            sudo nginx -t && sudo systemctl reload nginx
            # 4) 남은 앱 폴더(보유 데이터·.env)는 소유자만 열게 잠근다
            if [ -d "$HOME/stock-manager" ]; then
              chmod 700 "$HOME/stock-manager"
              find "$HOME/stock-manager" -maxdepth 1 -type f \( -name '.env' -o -name '*.db' -o -name '*.json' \) -exec chmod 600 {} \;
              echo "app dir locked (700, data files 600)"
            fi
            echo "=== verify ==="
            printf 'local / title: '; curl -s --max-time 5 http://127.0.0.1/ | grep -o '<title>[^<]*</title>' | head -1 || echo none
            printf 'local api health: '; curl -s -o /dev/null -w '%{http_code}\n' --max-time 5 http://127.0.0.1/api/v1/health || true
